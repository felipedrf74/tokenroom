# Advisory AI review of each pull request, from the shared `review-setup`
# skill. Rules: AGENTS.md `## Code Review Rules`, loaded through CLAUDE.md.
# It never blocks a merge: branch protection must not require it; the
# repository's required CI stays the gate.
#
# Runs Claude Code's code-review plugin, which posts inline comments, or one
# summary comment when it finds nothing, and skips pull requests it has
# already reviewed. Authenticates to GitHub with this workflow's token, so the
# Claude GitHub App is not required. Skips without the ANTHROPIC_API_KEY or
# CLAUDE_CODE_OAUTH_TOKEN repository secret, on drafts, on forks, and on
# documentation-only changes. A pull_request run uses this file from the
# branch, so same-repository branch authors are trusted with the secret.
name: Claude Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for a review credential
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No review credential secret; skipping the advisory review."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.credential.outputs.present == 'true' }}
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        if: ${{ steps.credential.outputs.present == 'true' }}
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
